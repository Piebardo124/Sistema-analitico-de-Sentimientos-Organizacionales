version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: plurione_user
      POSTGRES_PASSWORD: contrasenaultrasecreta
      POSTGRES_DB: sentiment_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgresql://plurione_user:contrasenaultrasecreta@db:5432/sentiment_db
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
    - ./frontend:/app  # Asumiendo que tu carpeta de React se llama "front"
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - web
volumes:
  postgres_data:
  